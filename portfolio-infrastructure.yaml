AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Travis Duncan Portfolio - Secure S3 bucket with CloudFront, ACM SSL certificate, and Route 53 DNS.
  Based on secure-bucket.yml with full website hosting infrastructure.

Parameters:
  DomainName:
    Type: String
    Description: 'Your domain name (e.g., travisduncansecurity.com)'
    Default: 'travisduncansecurity.com'
  
  HostedZoneId:
    Type: String
    Description: 'Existing Route 53 Hosted Zone ID for your domain'
    Default: 'Z07546006238QOGKRJV7'
  
  BucketNamePrefix:
    Type: String
    Description: 'Prefix for S3 bucket name (will be suffixed with account ID for uniqueness)'
    Default: 'travis-portfolio'

Conditions:
  # Check if HostedZoneId is provided (domain already exists in Route 53)
  HasExistingHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  # S3 Bucket - Based on secure-bucket.yml with website hosting enabled
  PortfolioWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Create unique bucket name using account ID
      BucketName: !Sub '${BucketNamePrefix}-${AWS::AccountId}'
      
      # Website hosting configuration (added for portfolio)
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      
      # Public access blocking - from your secure-bucket.yml
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      
      # Server-side encryption - from your secure-bucket.yml
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      
      # Versioning for backup and rollback capability
      VersioningConfiguration:
        Status: Enabled
      
      # Lifecycle rules for cost optimization (optional)
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      
      # Tags for organization
      Tags:
        - Key: Project
          Value: TravisDuncanPortfolio
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation

  # S3 Bucket Policy - Allow CloudFront to access bucket
  PortfolioWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortfolioWebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${PortfolioWebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # CloudFront Origin Access Control (OAC) - More secure than OAI
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketNamePrefix}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ACM SSL Certificate - Must be in us-east-1 for CloudFront
  WebsiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: travisduncansecurity.com
      SubjectAlternativeNames:
        - www.travisduncansecurity.com
      ValidationMethod: DNS
      Tags:
        - Key: Project
          Value: TravisDuncanPortfolio
        - Key: Environment
          Value: Production

  # CloudFront Distribution - Global CDN
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        # Enable distribution
        Enabled: true
        
        # HTTP/2 and HTTP/3 support
        HttpVersion: http2and3
        
        # IPv6 support
        IPV6Enabled: true
        
        # Price class (use all edge locations for best performance)
        PriceClass: PriceClass_All
        
        # Default root object
        DefaultRootObject: index.html
        
        # Domain aliases
        Aliases:
          - travisduncansecurity.com
          - www.travisduncansecurity.com
        
        # SSL/TLS certificate
        ViewerCertificate:
          AcmCertificateArn: !Ref WebsiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        
        # Origins (S3 bucket)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt PortfolioWebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        
        # Default cache behavior
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          
          # Caching policy (optimized for static website)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          
          # Response headers policy (security headers)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        
        # Custom error responses (for SPA routing)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        
        # Logging configuration (optional)
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          Prefix: cloudfront-logs/
          IncludeCookies: false
        
        # Comment
        Comment: CloudFront distribution for travisduncansecurity.com
      
      # Tags (must be outside DistributionConfig)
      Tags:
        - Key: Project
          Value: TravisDuncanPortfolio
        - Key: Environment
          Value: Production

  # S3 Bucket for CloudFront Logs
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-logs-${AWS::AccountId}'
      
      # Public access blocking
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      
      # Encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      
      # Lifecycle policy to delete old logs
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90
      
      # Ownership controls for CloudFront logging
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      
      Tags:
        - Key: Project
          Value: TravisDuncanPortfolio
        - Key: Environment
          Value: Production

  # Route 53 DNS Records
  DomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasExistingHostedZone
    Properties:
      HostedZoneId: Z07546006238QOGKRJV7
      Name: travisduncansecurity.com
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  WWWDomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasExistingHostedZone
    Properties:
      HostedZoneId: Z07546006238QOGKRJV7
      Name: www.travisduncansecurity.com
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  DomainAAAARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasExistingHostedZone
    Properties:
      HostedZoneId: Z07546006238QOGKRJV7
      Name: travisduncansecurity.com
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  WWWDomainAAAARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasExistingHostedZone
    Properties:
      HostedZoneId: Z07546006238QOGKRJV7
      Name: www.travisduncansecurity.com
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

# Outputs - Information you'll need after deployment
Outputs:
  BucketName:
    Description: 'S3 bucket name for portfolio website'
    Value: !Ref PortfolioWebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: 'S3 bucket ARN'
    Value: !GetAtt PortfolioWebsiteBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  CloudFrontDistributionId:
    Description: 'CloudFront distribution ID (needed for cache invalidation)'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  CloudFrontDomainName:
    Description: 'CloudFront distribution domain name'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomain'

  WebsiteURL:
    Description: 'Your portfolio website URL'
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-WebsiteURL'

  WWWWebsiteURL:
    Description: 'Your portfolio website URL (www)'
    Value: !Sub 'https://www.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-WWWWebsiteURL'

  CertificateArn:
    Description: 'ACM certificate ARN'
    Value: !Ref WebsiteCertificate
    Export:
      Name: !Sub '${AWS::StackName}-CertificateArn'

  LoggingBucketName:
    Description: 'S3 bucket name for CloudFront logs'
    Value: !Ref LoggingBucket
    Export:
      Name: !Sub '${AWS::StackName}-LoggingBucket'

  DeploymentCommand:
    Description: 'Command to deploy your portfolio after building'
    Value: !Sub |
      # Build your portfolio
      cd portfolio && npm run build && cd ..
      
      # Sync to S3
      aws s3 sync portfolio/dist/ s3://${PortfolioWebsiteBucket}/ --delete
      
      # Invalidate CloudFront cache
      aws cloudfront create-invalidation --distribution-id ${CloudFrontDistribution} --paths "/*"
